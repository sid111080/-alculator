<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reeko HUD</title>
  <style>
    :root {
      --bg-color: #FFF9ED;
      --hud-bg: #FFEFA5;
      --hud-ring: #FFE58F;
      --text-main: #333333;
      --text-secondary: #888888;
      --accent-green: #4CCB7B;
      --accent-orange: #F59E0B;
      --accent-blue: #4F95FF;
      --card-bg: #FFFFFF;
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --radius: 16px;
      --radius-lg: 24px;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .phone-frame {
      width: 375px;
      height: 812px;
      background: #F5F5F5;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 44px;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-sizing: border-box;
      color: #555;
      font-size: 12px;
      font-weight: 500;
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 6px;
      background: var(--bg-color);
      border-radius: 0 0 12px 12px;
    }

    .header-greeting {
      padding: 12px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
    }

    .help-icon {
      position: absolute;
      right: 16px;
      top: 24px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #E5E5EA;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 14px;
    }

    .profile-bar {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 16px;
      box-shadow: var(--card-shadow);
    }

    .avatar-mini {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #6A5CFF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      position: relative;
    }

    .badge {
      background: #E0F7FA;
      color: #006064;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-house {
      width: 20px;
      height: 20px;
      background: #E5E5EA;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 12px;
    }

    .apple-icon {
      width: 16px;
      height: 16px;
      background: #FF4D4D;
      border-radius: 50%;
      position: absolute;
      bottom: -4px;
      right: -4px;
    }

    .hud-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .hud-bg-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, var(--hud-bg) 0%, var(--hud-ring) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .hud-elements {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .character-container {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-avatar {
      width: 110px;
      height: 110px;
      background: #6A5CFF;
      border-radius: 50%;
      box-shadow: 0 12px 24px rgba(106, 92, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 24px;
      position: relative;
    }

    .character-avatar::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 20px;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      box-shadow: 16px 0 0 white;
    }

    .character-avatar::after {
      content: '';
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 4px;
      background: #444;
      border-radius: 4px;
    }

    .metric-group {
      display: flex;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 320px;
      justify-content: space-between;
    }

    .metric-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--card-shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 110px;
    }

    .metric-icon {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-green);
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .task-card {
      background: #FFF3CD;
      border-radius: 50px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.25);
      transform: rotate(-4deg);
    }

    .task-icon {
      width: 24px;
      height: 24px;
      background: #E5E5EA;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .task-text {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .task-reward {
      background: #FFFBED;
      color: var(--accent-orange);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
    }

    .progress-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--card-shadow);
      text-align: center;
      width: 100px;
    }

    .calendar-icon {
      width: 24px;
      height: 24px;
      background: #FFE58F;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 12px;
      margin: 0 auto 8px;
    }

    .progress-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-orange);
    }

    .bottom-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 10px;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-blue);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .nav-item.active .nav-icon {
      color: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="status-bar">
      <span>12:43</span>
      <span>● ● ●</span>
      <span>🔋</span>
    </div>
    <div class="header-greeting">Привет, Reeko!</div>
    <div class="help-icon">?</div>

    <div class="profile-bar">
      <div class="avatar-mini">R</div>
      <div class="badge">🌱 Малыш</div>
      <div class="icon-house">🏠</div>
      <div class="apple-icon"></div>
    </div>

    <div class="hud-area">
      <div class="hud-bg-ring"></div>
      <div class="hud-elements">
        <div class="metric-group">
          <div class="metric-card">
            <div class="metric-icon" style="background: #FFF3CD;">💰</div>
            <div>
              <div class="metric-value">200</div>
              <div class="metric-label">Баланс</div>
            </div>
          </div>

          <div class="task-card">
            <div class="task-icon">👤</div>
            <div>
              <div class="task-text">Посчитай сдачу</div>
              <div class="task-reward">+20 🪙</div>
            </div>
          </div>
        </div>

        <div class="character-container">
          <div class="character-avatar">R</div>
        </div>

        <div class="progress-card">
          <div class="calendar-icon">Hiy<br>0</div>
          <div class="progress-value">1/5</div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="nav-icon">🏠</div>
        <span>Главная</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">💼</div>
        <span>Бюджет</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">📝</div>
        <span>Задания</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">🛍️</div>
        <span>Покупки</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">🐷</div>
        <span>Копилка</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">📈</div>
        <span>Прогресс</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">🔒</div>
        <span>Взрослый</span>
      </div>
    </div>
  </div>
</body>
</html>
